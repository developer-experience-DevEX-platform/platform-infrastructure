name: Staging Kubernetes Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap:
    name: Bootstrap staging Kubernetes
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::980829302319:role/devex-staging-eks-admin
          aws-region: eu-west-2
          role-session-name: devex-staging-kubernetes-bootstrap-${{ github.run_id }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.0

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Configure Kubernetes access
        run: |
          aws eks update-kubeconfig \
            --name devex-staging \
            --region eu-west-2

      - name: Prove Kubernetes access
        run: |
          kubectl get nodes -o wide
          kubectl get namespaces

      - name: Add Argo CD Helm repository
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update argo

      - name: Install Argo CD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --create-namespace \
            --version 10.4.0 \
            --values platform/argocd/staging-values.yaml \
            --wait \
            --timeout 10m

      - name: Verify Argo CD
        run: |
          kubectl wait \
            --namespace argocd \
            --for=condition=Ready \
            pods \
            --all \
            --timeout=5m

          helm list --namespace argocd
          kubectl get pods --namespace argocd
          kubectl get deployments --namespace argocd
          kubectl get statefulsets --namespace argocd
          kubectl get services --namespace argocd
          kubectl get nodes

      - name: Verify private exposure
        shell: bash
        run: |
          non_private_services=$(
            kubectl get services --namespace argocd --output json |
              jq '[.items[] | select(.spec.type != "ClusterIP")] | length'
          )
          ingress_count=$(
            kubectl get ingress --namespace argocd --output json |
              jq '.items | length'
          )

          if [[ "$non_private_services" -ne 0 ]]; then
            echo "::error::Argo CD has a service that is not ClusterIP."
            exit 1
          fi

          if [[ "$ingress_count" -ne 0 ]]; then
            echo "::error::Argo CD has an ingress resource."
            exit 1
          fi
