# Posts to Slack when Backstage opens a golden-path PR (branch backstage/**).
# Set org or repo secret SLACK_GOLDEN_PATH_WEBHOOK to a Slack incoming webhook.
# Missing webhook fails this job only; continue-on-error keeps the PR mergeable.
name: Notify golden-path PR

on:
  pull_request:
    types:
      - opened

permissions:
  contents: read

jobs:
  notify-slack:
    name: Notify Slack
    if: startsWith(github.head_ref, 'backstage/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - name: Post pull request to Slack
        uses: slackapi/slack-github-action@91efab103c0de0a537f72a35f6b8cda0ee76bf0a # v2.1.1
        with:
          webhook: ${{ secrets.SLACK_GOLDEN_PATH_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            text: "Golden-path PR in ${{ github.repository }}: ${{ github.event.pull_request.title }} ${{ github.event.pull_request.html_url }}"
