name: Bootstrap Service CI Identity

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: Service name used for the Terraform definition and CI identity
        required: true
        type: string
      github_repository:
        description: Name of the service repository in developer-experience-DevEX-platform
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      GITHUB_OWNER: developer-experience-DevEX-platform
      SERVICE_NAME: ${{ inputs.service_name }}
      GITHUB_REPOSITORY_NAME: ${{ inputs.github_repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out platform infrastructure
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate inputs
        shell: bash
        run: |
          if [[ ! "$SERVICE_NAME" =~ ^[a-z0-9][a-z0-9-]{0,62}$ ]]; then
            echo "::error::service_name must use lowercase kebab-case and be no more than 63 characters."
            exit 1
          fi

          if [[ ! "$GITHUB_REPOSITORY_NAME" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::github_repository contains invalid characters."
            exit 1
          fi

      - name: Read GitHub repository metadata
        shell: bash
        run: |
          if ! repository_json="$(gh api "repos/$GITHUB_OWNER/$GITHUB_REPOSITORY_NAME")"; then
            echo "::error::Repository $GITHUB_OWNER/$GITHUB_REPOSITORY_NAME could not be found or accessed."
            exit 1
          fi

          repository_id="$(jq -r '.id' <<< "$repository_json")"
          owner_id="$(jq -r '.owner.id' <<< "$repository_json")"

          if [[ ! "$repository_id" =~ ^[0-9]+$ || ! "$owner_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub returned invalid repository metadata for $GITHUB_OWNER/$GITHUB_REPOSITORY_NAME."
            exit 1
          fi

          echo "TARGET_REPOSITORY_ID=$repository_id" >> "$GITHUB_ENV"
          echo "TARGET_OWNER_ID=$owner_id" >> "$GITHUB_ENV"

      - name: Generate service identity definition
        shell: bash
        run: |
          service_directory="environments/dev/services/$SERVICE_NAME"

          if [[ -e "$service_directory" ]]; then
            echo "::error::Service definition already exists at $service_directory; refusing to overwrite it."
            exit 1
          fi

          mkdir -p "$service_directory"

          cat > "$service_directory/main.tf" <<EOF
          module "service_ci_identity" {
            source = "../../../../modules/service-ci-identity"

            service_name         = "$SERVICE_NAME"
            github_owner         = "$GITHUB_OWNER"
            github_owner_id      = "$TARGET_OWNER_ID"
            github_repository    = "$GITHUB_REPOSITORY_NAME"
            github_repository_id = "$TARGET_REPOSITORY_ID"
            github_branch        = "main"

            resource_group_name = var.resource_group_name
            location            = var.location
            acr_id               = var.acr_id
          }
          EOF

          cat > "$service_directory/providers.tf" <<'EOF'
          terraform {
            required_version = ">= 1.8.0"

            required_providers {
              azurerm = {
                source  = "hashicorp/azurerm"
                version = "~> 4.81.0"
              }
            }
          }

          provider "azurerm" {
            features {}
          }
          EOF

          cat > "$service_directory/variables.tf" <<'EOF'
          variable "resource_group_name" {
            description = "Name of the existing resource group for the service CI identity."
            type        = string
          }

          variable "location" {
            description = "Azure region in which to create the service CI identity."
            type        = string
          }

          variable "acr_id" {
            description = "Resource ID of the existing Azure Container Registry."
            type        = string
          }
          EOF

          cat > "$service_directory/outputs.tf" <<'EOF'
          output "client_id" {
            description = "Client ID of the service CI managed identity."
            value       = module.service_ci_identity.client_id
          }

          output "principal_id" {
            description = "Principal ID of the service CI managed identity."
            value       = module.service_ci_identity.principal_id
          }

          output "identity_id" {
            description = "Azure resource ID of the service CI managed identity."
            value       = module.service_ci_identity.identity_id
          }
          EOF

          cat > "$service_directory/terraform.tfvars" <<'EOF'
          resource_group_name = "Backstage-workflow"
          location            = "eastus"
          acr_id               = "/subscriptions/61285c3b-1197-45d3-8585-75efc3bd6b73/resourceGroups/Backstage-workflow/providers/Microsoft.ContainerRegistry/registries/devexplatformacr"
          EOF

          terraform fmt -recursive "$service_directory"

      - name: Commit generated definition
        shell: bash
        run: |
          branch_name="backstage/$SERVICE_NAME-ci-identity"

          if git ls-remote --exit-code --heads origin "$branch_name" >/dev/null 2>&1; then
            echo "::error::Branch $branch_name already exists; refusing to overwrite it."
            exit 1
          fi

          git switch --create "$branch_name"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "environments/dev/services/$SERVICE_NAME"
          git commit -m "chore: provision CI identity for $SERVICE_NAME"
          git push --set-upstream origin "$branch_name"

      - name: Open pull request
        shell: bash
        run: |
          branch_name="backstage/$SERVICE_NAME-ci-identity"
          gh pr create \
            --base main \
            --head "$branch_name" \
            --title "chore: provision CI identity for $SERVICE_NAME" \
            --body "Generated by Backstage to provision the CI identity for \`$GITHUB_OWNER/$GITHUB_REPOSITORY_NAME\`."
