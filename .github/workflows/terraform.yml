name: Terraform

on:
  pull_request:
    paths:
      - 'environments/**'
      - 'modules/**'
  push:
    branches:
      - main
    paths:
      - 'environments/**'
      - 'modules/**'

permissions:
  contents: read
  id-token: write

jobs:
  detect-stack:
    name: Detect Service Stack
    runs-on: ubuntu-latest
    outputs:
      working_directory: ${{ steps.detect.outputs.working_directory }}
      environment: ${{ steps.detect.outputs.environment }}
      service_name: ${{ steps.detect.outputs.service_name }}
      state_key: ${{ steps.detect.outputs.state_key }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed service stack
        id: detect
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          mapfile -t service_stacks < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" |
              sed -nE 's#^(environments/[^/]+/services/[^/]+)/.*#\1#p' |
              sort -u
          )

          if [[ ${#service_stacks[@]} -eq 0 ]]; then
            echo "::error::No changed service stack was detected under environments/<environment>/services/<service>."
            exit 1
          fi

          if [[ ${#service_stacks[@]} -gt 1 ]]; then
            echo "::error::More than one service stack changed. Multi-service changes are not yet supported."
            printf 'Detected stack: %s\n' "${service_stacks[@]}"
            exit 1
          fi

          working_directory="${service_stacks[0]}"
          environment_name=$(cut -d/ -f2 <<< "$working_directory")
          service_name=$(cut -d/ -f4 <<< "$working_directory")
          state_key="$environment_name/services/$service_name/terraform.tfstate"

          {
            echo "working_directory=$working_directory"
            echo "environment=$environment_name"
            echo "service_name=$service_name"
            echo "state_key=$state_key"
          } >> "$GITHUB_OUTPUT"

  terraform-plan:
    name: Terraform Plan
    if: github.event_name == 'pull_request'
    needs: detect-stack
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ needs.detect-stack.outputs.service_name }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
      GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: ${{ needs.detect-stack.outputs.state_key }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS plan credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: devex-terraform-plan-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: |
          terraform init \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=$TERRAFORM_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: terraform validate

      - name: Discover GitHub repository identity
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          SERVICE_NAME: ${{ needs.detect-stack.outputs.service_name }}
        shell: bash
        run: |
          repo_json=$(gh api "repos/$GITHUB_OWNER/$SERVICE_NAME")
          repo_id=$(jq -r '.id' <<< "$repo_json")
          owner_id=$(jq -r '.owner.id' <<< "$repo_json")

          if [[ ! "$repo_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub repository ID was missing or non-numeric."
            exit 1
          fi

          if [[ ! "$owner_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub owner ID was missing or non-numeric."
            exit 1
          fi

          echo "Discovered GitHub owner ID: $owner_id"
          echo "Discovered GitHub repository ID: $repo_id"
          {
            echo "TF_VAR_github_owner_id=$owner_id"
            echo "TF_VAR_github_repository_id=$repo_id"
          } >> "$GITHUB_ENV"

      - name: Plan Terraform changes
        id: plan
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: terraform plan -out=tfplan

      - name: Render Terraform plan
        if: always()
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        shell: bash
        run: |
          if [[ -f tfplan ]]; then
            terraform show -no-color tfplan > tfplan.txt
          else
            echo "Terraform plan was not generated." > tfplan.txt
          fi

      - name: Upload Terraform plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ needs.detect-stack.outputs.service_name }}
          path: ${{ needs.detect-stack.outputs.working_directory }}/tfplan.txt
          retention-days: 30

      - name: Write plan summary
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ needs.detect-stack.outputs.environment }}
          SERVICE_NAME: ${{ needs.detect-stack.outputs.service_name }}
          WORKING_DIRECTORY: ${{ needs.detect-stack.outputs.working_directory }}
          STATE_KEY: ${{ needs.detect-stack.outputs.state_key }}
          PLAN_RESULT: ${{ steps.plan.outcome }}
        shell: bash
        run: |
          {
            echo "# Terraform Plan"
            echo
            echo "- Environment: $ENVIRONMENT_NAME"
            echo "- Service: $SERVICE_NAME"
            echo "- Working directory: $WORKING_DIRECTORY"
            echo "- State key: $STATE_KEY"
            echo "- Plan result: $PLAN_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"

  terraform-apply:
    name: Terraform Apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: detect-stack
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
      TF_INPUT: false
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ needs.detect-stack.outputs.service_name }}
      TF_VAR_github_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
      GITHUB_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_KEY: ${{ needs.detect-stack.outputs.state_key }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS apply credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.TERRAFORM_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: devex-terraform-apply-${{ github.run_id }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: |
          terraform init \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=$TERRAFORM_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: terraform validate

      - name: Discover GitHub repository identity
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          SERVICE_NAME: ${{ needs.detect-stack.outputs.service_name }}
        shell: bash
        run: |
          repo_json=$(gh api "repos/$GITHUB_OWNER/$SERVICE_NAME")
          repo_id=$(jq -r '.id' <<< "$repo_json")
          owner_id=$(jq -r '.owner.id' <<< "$repo_json")

          if [[ ! "$repo_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub repository ID was missing or non-numeric."
            exit 1
          fi

          if [[ ! "$owner_id" =~ ^[0-9]+$ ]]; then
            echo "::error::GitHub owner ID was missing or non-numeric."
            exit 1
          fi

          echo "Discovered GitHub owner ID: $owner_id"
          echo "Discovered GitHub repository ID: $repo_id"
          {
            echo "TF_VAR_github_owner_id=$owner_id"
            echo "TF_VAR_github_repository_id=$repo_id"
          } >> "$GITHUB_ENV"

      - name: Plan Terraform changes
        run: terraform plan -out=tfplan
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}

      - name: Apply Terraform changes
        id: apply
        working-directory: ${{ needs.detect-stack.outputs.working_directory }}
        run: terraform apply -auto-approve tfplan

      - name: Write apply summary
        if: always()
        env:
          ENVIRONMENT_NAME: ${{ needs.detect-stack.outputs.environment }}
          SERVICE_NAME: ${{ needs.detect-stack.outputs.service_name }}
          STATE_KEY: ${{ needs.detect-stack.outputs.state_key }}
          APPLY_RESULT: ${{ steps.apply.outcome }}
        shell: bash
        run: |
          {
            echo "# Terraform Apply"
            echo
            echo "- Environment: $ENVIRONMENT_NAME"
            echo "- Service: $SERVICE_NAME"
            echo "- State key: $STATE_KEY"
            echo "- Apply result: $APPLY_RESULT"
          } >> "$GITHUB_STEP_SUMMARY"
